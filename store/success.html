<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <title>Order received - Small Victories</title>
    <link rel="stylesheet" href="style.css">
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark')</script>

<body>
    <div id="theme-toggle" onclick="toggleTheme()"></div>
    <main class="success-wrap">
        <h1>Thank you.</h1>
        <p class="lede">Your order is in. Each print is made to order — printed and framed by hand in
            Melbourne, then delivered to your door within two weeks by tracked courier
            (you'll get a text when it's on its way). A receipt is on its way to your inbox.</p>
        <p><a href="./">← Back to the print store</a></p>
    </main>
    <script src="theme.js"></script>
</body>

</html>
